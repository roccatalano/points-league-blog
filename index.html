<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Fantasy 2026</title>
<meta name="description" content="Live odds, daily posts, trade reviews and weekly roundups for a head-to-head points league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #16181d; --muted: #5d6270; --line: #e3e0d8;
    --accent: #e8590c; --accent-soft: #fdebe0; --head: #121826; --head-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #171b23; --ink: #eceef2; --muted: #9aa1ae; --line: #262c37;
            --accent: #ff7a2f; --accent-soft: #2b1d14; --head: #0a0d12; --head-ink: #ffffff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 Inter, system-ui, -apple-system, sans-serif; }
  header { background: var(--head); color: var(--head-ink); padding: 28px 16px 24px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  header .wrap { padding: 0; }
  header a { color: inherit; text-decoration: none; }
  .brand { font-family: "Archivo Black", Inter, sans-serif; font-size: clamp(26px, 6vw, 38px);
           letter-spacing: -0.5px; line-height: 1.1; }
  .brand span { color: var(--accent); }
  .tag { color: #b8bfcc; font-size: 14px; margin-top: 6px; }
  main { padding: 24px 0 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 18px 20px; margin-bottom: 14px; display: block; color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 11px;
          text-transform: uppercase; letter-spacing: 0.6px; padding: 2px 8px; border-radius: 99px; }
  .card h2 { margin: 6px 0 4px; font-size: 20px; line-height: 1.3; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }
  article h1 { font-family: "Archivo Black", Inter, sans-serif; font-size: clamp(26px, 6vw, 34px);
               line-height: 1.15; margin: 8px 0 16px; }
  article h2 { font-size: 20px; margin: 28px 0 8px; }
  article a { color: var(--accent); }
  article table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
  article th, article td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
  article ul, article ol { padding-left: 22px; }
  article blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
  .back { display: inline-block; margin-bottom: 8px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 15px; }
  .empty { color: var(--muted); }
  nav { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  nav a { color: #cfd5e0; text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 12px;
          border-radius: 99px; border: 1px solid #2c3446; }
  nav a.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .updated { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .mu-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .mu-team { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .mu-team.r { text-align: right; }
  .mu-team, .tr-team { min-width: 0; overflow-wrap: anywhere; }
  .mu-score { font-family: "Archivo Black", Inter, sans-serif; font-size: 22px; text-align: center; white-space: nowrap; }
  .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; margin: 10px 0 4px; background: var(--line); }
  .bar i { display: block; background: var(--accent); }
  .bar b { display: block; background: #4c6ef5; opacity: .75; }
  .mu-odds { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .mu-odds strong { color: var(--ink); }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); }
  .cats { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
  .cats td, .cats th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: center; }
  .cats th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .cats td:first-child, .cats th:first-child { text-align: left; font-weight: 600; }
  .win { font-weight: 700; }
  .calc label.lbl { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 4px 0; }
  .calc select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
                 background: var(--card); color: var(--ink); }
  .plist { margin-top: 10px; display: grid; gap: 4px; }
  .plist label { display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 6px 4px; border-radius: 8px; }
  .plist label:hover { background: var(--accent-soft); }
  .plist small { color: var(--muted); }
  .res { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .res .big { font-family: "Archivo Black", Inter, sans-serif; font-size: 28px; }
  .pos { color: #2f9e44; } .neg { color: #e03131; }
  .note { font-size: 13px; color: var(--muted); }
  .ladder { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ladder th { color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  .ladder td { padding: 9px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ladder th:nth-child(2), .ladder td:nth-child(2) { text-align: left; white-space: normal; overflow-wrap: break-word; }
  .ladder th:first-child, .ladder td:first-child { text-align: left; color: var(--muted); width: 22px; }
  .ladder tr.cut td { border-bottom: 2px dashed var(--accent); }
  .ladder .tm { font-weight: 700; }
  .ladder small { color: var(--muted); display: block; font-size: 12px; }
  .up { color: #2f9e44; font-size: 12px; } .down { color: #e03131; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .chip.off { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
  .explain h3 { font-size: 16px; margin: 16px 0 4px; }
  .explain p, .explain li { font-size: 14.5px; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters select { flex: 1; font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .seg { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px; margin-bottom: 12px; }
  .seg button { flex: 1; font: inherit; font-size: 13.5px; font-weight: 600; border: 0; background: none; color: var(--muted); padding: 7px 6px; border-radius: 99px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .inj { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .inj:last-child { border-bottom: 0; }
  .inj .nm { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .inj .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .inj .ret { text-align: right; white-space: nowrap; }
  .inj .ret b { display: block; font-family: "Archivo Black", Inter, sans-serif; font-size: 18px; font-weight: 400; }
  .inj .ret small { color: var(--muted); font-size: 12px; }
  .inj .nt { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .grp { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 0 6px; }
  .chip.out { background: #fde2e2; color: #c92a2a; } .chip.dtd { background: #fff3bf; color: #946200; } .chip.ft { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  @media (prefers-color-scheme: dark) { .chip.out { background: #3b1717; color: #ff8787; } .chip.dtd { background: #3a2f0b; color: #ffd43b; } }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .kpi b { display: block; font-family: "Archivo Black", Inter, sans-serif; font-size: 24px; font-weight: 400; line-height: 1.1; }
  .kpi span { font-size: 12px; color: var(--muted); line-height: 1.3; display: block; margin-top: 4px; }
  .cal { display: grid; grid-template-columns: 64px 1fr 74px; gap: 8px; align-items: center; font-size: 13px; padding: 5px 0; }
  .cal .track { position: relative; height: 10px; background: var(--line); border-radius: 99px; }
  .cal .act { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
  .cal .pred { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
  .mrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mrow:last-child { border-bottom: 0; }
  .mrow small { color: var(--muted); display: block; font-size: 12px; }
  .cats.bl td:last-child, .cats.bl th:last-child { text-align: left; }
  .ok { color: #2f9e44; font-weight: 700; } .miss { color: #e03131; font-weight: 700; }
  @media (max-width: 420px) { .kpi b { font-size: 20px; } }
  /* ---- model record ---- */
  .rc { padding-top: 0; }
  main.wrap { padding-top: 24px; }
  .cats a { color: var(--accent); }
  .rc section { margin-bottom: 26px; }
  .rc-chart { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px 12px 16px; margin-bottom: 12px; }
  .rc-cols { position: relative; height: 150px; display: flex; gap: 10px; padding-left: 4px; padding-right: 74px; margin-bottom: 44px; }
  .rc-col { flex: 1; max-width: 64px; display: flex; flex-direction: column; position: relative; }
  .rc-plot { position: relative; flex: 1; }
  .rc-b { position: absolute; left: 12%; right: 12%; border-radius: 5px; animation: rcGrow .6s cubic-bezier(.2,.8,.2,1) both; }
  .rc-b.up { background: #2f9e44; } .rc-b.dn { background: #e03131; }
  .rc-b em { position: absolute; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .rc-b.up em { bottom: 100%; margin-bottom: 3px; color: #2f9e44; } .rc-b.dn em { top: 100%; margin-top: 3px; color: #e03131; }
  @keyframes rcGrow { from { transform: scaleY(0); } }
  .rc-b.up { transform-origin: bottom; } .rc-b.dn { transform-origin: top; }
  .rc-x { position: absolute; left: 0; right: 0; top: 100%; margin-top: 24px; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .rc-zero, .rc-avg { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
  .rc-cols .rc-zero, .rc-cols .rc-avg { bottom: auto; }
  .rc-zero { border-top: 1.5px solid var(--ink); opacity: .55; margin-top: -1px; }
  .rc-avg { border-top: 1.5px dashed var(--accent); }
  .rc-zero em, .rc-avg em { position: absolute; right: 0; transform: translateY(-50%); font-style: normal; font-size: 10.5px; font-weight: 700; background: var(--card); padding: 0 0 0 6px; white-space: nowrap; }
  .rc-zero em { color: var(--muted); } .rc-avg em { color: var(--accent); }
  .rc-cap { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.45; }
  .rc-hero { background: var(--head); color: #fff; border-radius: 18px; padding: 20px 20px 16px; margin-bottom: 26px; position: relative; overflow: hidden; }
  .rc-hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(232,89,12,.35), transparent 70%); }
  .rc-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: #9aa3b5; }
  .rc-big { font-family: "Archivo Black", Inter, sans-serif; font-size: clamp(30px, 8.5vw, 42px); line-height: 1.02; margin: 8px 0 6px; color: var(--accent); }
  .rc-big span { color: #fff; display: block; font-size: .62em; }
  .rc-sub { font-size: 14px; color: #c3c9d5; }
  .rc-sub strong { color: #fff; }
  .rc-ruler { position: relative; margin: 34px 4px 0; padding-bottom: 4px; }
  .rc-track { height: 8px; border-radius: 99px; background: linear-gradient(90deg, #3a2a24, #2f3a2f 60%, #2f9e44); position: relative; overflow: hidden; }
  .rc-worse { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(224,49,49,.55) 0 4px, transparent 4px 8px); }
  .rc-tick { position: absolute; top: -4px; width: 1px; height: 16px; background: rgba(255,255,255,.45); }
  .rc-tick em { position: absolute; top: 19px; transform: translateX(-50%); font-style: normal; font-size: 10.5px; color: #9aa3b5; white-space: nowrap; }
  .rc-me { position: absolute; top: -6px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(232,89,12,.3); animation: rcIn .7s cubic-bezier(.2,.8,.2,1) both; }
  .rc-me b { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: #fff; white-space: nowrap; }
  .rc-pin { position: absolute; top: -18px; transform: translateX(-50%); font-size: 9.5px; font-weight: 700; color: #16181d; background: #cfd5e0; border-radius: 4px; padding: 0 4px; line-height: 14px; opacity: .85; }
  .rc-pin::before { content: "W"; }
  .rc-key { position: static; transform: none; display: inline-block; }
  .rc-ends > span:nth-child(2) { color: #9aa3b5; }
  @media (prefers-color-scheme: dark) { .rc-hero { border: 1px solid #262c37; } }
  .rc-ends { display: flex; justify-content: space-between; font-size: 10.5px; color: #6f7889; margin-top: 30px; }
  @keyframes rcIn { from { left: 0; opacity: 0; } }
  .rc-h { font-family: "Archivo Black", Inter, sans-serif; font-weight: 400; font-size: 18px; margin: 0 0 10px; }
  .rc-h small { display: block; font-family: Inter, sans-serif; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .rc-list, .rc-panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .rc-panel { padding: 4px 16px; }
  .rc-wk { border-bottom: 1px solid var(--line); margin: 0; }
  .rc-wk:last-child { border-bottom: 0; }
  .rc-wk summary { list-style: none; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 13px 16px; color: var(--ink); font-weight: 400; }
  .rc-wk summary::-webkit-details-marker { display: none; }
  .rc-wk[open] summary { background: var(--accent-soft); }
  .rc-wn { font-family: "Archivo Black", Inter, sans-serif; font-size: 17px; color: var(--muted); }
  .rc-mid { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .rc-lbl { font-size: 13.5px; font-weight: 600; }
  .rc-val { font-family: "Archivo Black", Inter, sans-serif; font-size: 18px; }
  .rc-wk.live .rc-val { font-family: Inter, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); }
  .rc-wk.live .rc-val::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 5px; animation: rcPulse 1.6s infinite; }
  @keyframes rcPulse { 50% { opacity: .25; } }
  .rc-dots { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .rc-dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  i.ok, i.up { background: #2f9e44; } i.no, i.dn { background: #e03131; } i.lvl { background: var(--line); }
  i.up, i.dn { background: transparent; border: 2px solid; } i.up { border-color: #2f9e44; } i.dn { border-color: #e03131; }
  .rc-m { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: start; padding: 9px 16px 9px 66px; font-size: 14px; border-top: 1px dashed var(--line); }
  .rc-m i { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; display: block; }
  .rc-m small { display: block; color: var(--muted); font-size: 12.5px; }
  .rc-m b small { display: inline; }
  .rc-note { margin: 0; padding: 8px 16px 8px 66px; font-size: 12.5px; color: var(--muted); }
  .rc-band { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rc-band:last-child { border-bottom: 0; }
  .rc-bl { font-family: "Archivo Black", Inter, sans-serif; font-size: 13.5px; white-space: nowrap; }
  .rc-band small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .rc-chip { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
  .rc-chip.good { background: #d3f9d8; color: #2b8a3e; } .rc-chip.bad { background: #ffe3e3; color: #c92a2a; } .rc-chip.warn { background: #fff3bf; color: #946200; }
  @media (prefers-color-scheme: dark) { .rc-chip.good { background: #173a20; color: #8ce99a; } .rc-chip.bad { background: #3b1717; color: #ff8787; } .rc-chip.warn { background: #3a2f0b; color: #ffd43b; } }
  .rc-bar { position: relative; height: 8px; background: var(--line); border-radius: 99px; }
  .rc-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
  .rc-bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .5; }
  .rc-how { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .rc-how summary { font-weight: 700; color: var(--accent); }
  .rc-how ol { padding-left: 20px; } .rc-how li { margin-bottom: 6px; }
  @media (max-width: 400px) { .rc-m, .rc-note { padding-left: 16px; } }
  .wp { position: relative; margin: 14px 0 4px; padding: 14px 0 0; touch-action: pan-y; }
  .wp-plot { position: relative; height: 172px; }
  .wp svg { width: 100%; height: 172px; display: block; overflow: visible; }
  .wp-grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .wp-mid { stroke: var(--muted); stroke-dasharray: 3 4; stroke-width: 1; vector-effect: non-scaling-stroke; opacity: .7; }
  .wp-day { font-size: 11px; fill: var(--muted); text-anchor: middle; font-weight: 600; }
  .wp-fh { fill: var(--accent); opacity: .22; } .wp-fa { fill: #4c6ef5; opacity: .2; }
  .wp-line { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
  .wp-cur { stroke: var(--ink); stroke-width: 1; opacity: .5; }
  .wp-dot { position: absolute; width: 10px; height: 10px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); pointer-events: none; }
  .wp-dot.a { background: #4c6ef5; box-shadow: 0 0 0 4px rgba(76,110,245,.2); }
  .wp-lbl { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wp-lbl.top { position: absolute; top: 0; left: 0; color: var(--accent); }
  .wp-lbl.bot { margin-top: 2px; color: #4c6ef5; }
  .wp-tip { position: absolute; top: -6px; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 8px; white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 2; }
  .mu-team.lose { opacity: .5; }
  .tr-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; margin-top: 6px; }
  .tr-side:last-child { text-align: right; }
  .tr-team { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .tr-gets { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .tr-grade { display: inline-block; margin-top: 8px; font-family: "Archivo Black", Inter, sans-serif; font-size: 20px; line-height: 1; padding: 6px 10px; border-radius: 10px; }
  .tr-grade.a { background: #d3f9d8; color: #2b8a3e; } .tr-grade.b { background: #e7f5ff; color: #1971c2; } .tr-grade.c { background: #fff3bf; color: #946200; } .tr-grade.d { background: #ffe3e3; color: #c92a2a; }
  .tr-grade.early { font-family: Inter, sans-serif; font-size: 11px; font-weight: 700; padding: 4px 8px; background: var(--line); color: var(--muted); }
  @media (prefers-color-scheme: dark) { .tr-grade.a { background: #173a20; color: #8ce99a; } .tr-grade.b { background: #132c44; color: #74c0fc; } .tr-grade.c { background: #3a2f0b; color: #ffd43b; } .tr-grade.d { background: #3b1717; color: #ff8787; } }
  .tr-mid { text-align: center; padding-top: 2px; min-width: 64px; }

  .tb-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  .tb-row:last-child { border-bottom: 0; }
  .tb-row small { display: block; color: var(--muted); font-size: 12px; }
  .tb-rk { font-family: "Archivo Black", Inter, sans-serif; color: var(--muted); }
  .tb-sc { font-family: "Archivo Black", Inter, sans-serif; font-size: 18px; }
  .tr-wa { font-family: "Archivo Black", Inter, sans-serif; font-size: 15px; margin-top: 6px; }
  .tr-wa small { display: block; font-family: Inter, sans-serif; font-size: 11px; font-weight: 600; color: var(--muted); }
  .tr-meta { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .mu-team small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .mu-score small { font-size: 14px; color: var(--muted); }
  .tr-pend { font-size: 16px; color: var(--muted); }
  .mu-odds b { color: var(--ink); }
  .tc-a, .tc-b { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .tc-a { stroke: var(--accent); } .tc-b { stroke: #4c6ef5; }
  .tc-zero { position: absolute; left: -2px; transform: translate(-100%, -50%); font-size: 10.5px; font-weight: 700; color: var(--muted); padding-right: 4px; }
  .tc .wp-plot { margin-left: 12px; margin-right: 6px; }
  .tc-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; font-weight: 600; margin-top: 6px; color: var(--muted); }
  .tc-key span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .tc-key .ka { color: var(--ink); } .tc-key .ka::before { background: var(--accent); }
  .tc-key .kb { color: var(--ink); } .tc-key .kb::before { background: #4c6ef5; }
  .tc-key .kn::before { display: none; } .tc-key .kn { margin-left: auto; }
  .mu-odds strong.pos, .tc-end.pos, .wp-tip .pos { color: #2f9e44; } .mu-odds strong.neg, .tc-end.neg, .wp-tip .neg { color: #e03131; }
  .tc-wrap { display: grid; grid-template-columns: 38px 1fr 50px; }
  .tc-wrap .wp-plot { grid-column: 2; margin: 0; }
  .tc .wp-plot { margin-left: 0; margin-right: 0; }
  .tc-axis { position: relative; grid-column: 1; }
  .tc-y { position: absolute; right: 6px; transform: translateY(-50%); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tc-end { position: absolute; left: 100%; margin-left: 10px; transform: translateY(-50%); font-family: "Archivo Black", Inter, sans-serif; font-size: 12.5px; white-space: nowrap; }
  .tc .wp-tip { top: -8px; line-height: 1.45; white-space: nowrap; text-align: left; }
  .tc .wp-tip .pos { color: #69db7c; } .tc .wp-tip .neg { color: #ff8787; }
  .tc-dates { margin-left: 38px; margin-right: 50px; }
  .ld { padding: 6px 14px; }
  .ld .ladder td, .ld .ladder th { padding-left: 3px; padding-right: 3px; }
  .ld .ladder td { font-variant-numeric: tabular-nums; }
  .ld-r { cursor: pointer; }
  .ld-r:hover td { background: var(--accent-soft); }
  .ld-r.open td { border-bottom-color: transparent; background: var(--accent-soft); }
  .ld .up, .ld .down { margin-left: 3px; font-size: 10.5px; }
  .ld-x td { padding: 4px 4px 14px !important; text-align: left !important; white-space: normal !important; background: var(--accent-soft); color: var(--ink) !important; }
  @media (prefers-color-scheme: dark) { .ld-c.hi { background: #173a20; border-color: #1f4d2b; } .ld-c.hi span { color: #8ce99a; } .ld-c.lo { background: #3b1717; border-color: #5c2020; } .ld-c.lo span { color: #ff8787; } }
  .ld-facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .ld-facts b { color: var(--ink); }
  .ladder.pw { font-size: 12.5px; } .ladder.pw td small { font-size: 10.5px; } .ld .ladder.pw td, .ld .ladder.pw th { padding-left: 2px; padding-right: 2px; } .ladder.pw td:nth-child(2) { overflow-wrap: anywhere; font-size: 12px; } .ladder.pw th { font-size: 10.5px; letter-spacing: 0; }
  .ld { padding: 6px 10px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 0 16px 32px; }
  .pts { font-family: "Archivo Black", Inter, sans-serif; font-size: 22px; text-align: center; white-space: nowrap; line-height: 1.1; }
  .pts small { display: block; font-family: Inter, sans-serif; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-top: 3px; }
  .mu-sub { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .mg-band { fill: var(--ink); opacity: .08; }
  .mg-pos { fill: var(--accent); opacity: .18; } .mg-neg { fill: #4c6ef5; opacity: .18; }
  .mg-y { position: absolute; left: 0; transform: translateY(-50%); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pl { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; font-size: 13.5px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .pl:last-child { border-bottom: 0; } .pl span { color: var(--muted); }
  .rc-wait { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<header><div class="wrap">
  <a href="#"><div class="brand">NBA FANTASY <span>2026</span></div></a>
  <div class="tag">Daily posts, trade reviews and weekly roundups for a head-to-head points league. Updated automatically.</div>
  <nav><a href="#/" data-n="posts">Posts</a><a href="#/odds" data-n="odds">Live odds</a><a href="#/ladder" data-n="ladder">Ladder</a><a href="#/trade" data-n="trade">Trade calculator</a><a href="#/injuries" data-n="injuries">Injuries</a><a href="#/trades" data-n="trades">Trades</a><a href="#/record" data-n="record">Model record</a></nav>
</div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<footer>Odds and projections come from a model, not a crystal ball.</footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="model.js"></script>
<script>
const app = document.getElementById("app");
const KIND = { daily: "Daily", weekly: "Weekly roundup", trade: "Trade review", catchup: "Catch-up" };
let posts = [];

function niceDate(d) {
  const dt = new Date(d + "T12:00:00");
  return isNaN(dt) ? d : dt.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function meta(p) { return `<div class="meta"><span class="pill">${esc(KIND[p.kind] || p.kind)}</span><span>${esc(niceDate(p.date))}</span></div>`; }
async function getJSON(path) { const r = await fetch(path, { cache: "no-cache" }); if (!r.ok) throw new Error(path); return r.json(); }
function setNav(n) { document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.n === n)); }
function ago(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 2880 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago";
}
const short = n => n.replace(/[^A-Za-z0-9 ]/g, "").trim().split(/\s+/)[0].slice(0, 10);
const f1 = x => (x == null ? "–" : Number.isInteger(+x) ? String(+x) : Number(x).toFixed(1));
const f0 = x => (x == null ? "–" : Math.round(x).toLocaleString("en-AU"));
const sgn = (x, d = 0) => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
const cls = (x, eps = 0.0005) => x == null ? "" : x > eps ? "pos" : x < -eps ? "neg" : "";
const day = s => new Date(s + "T12:00:00").toLocaleDateString("en-AU", { day: "numeric", month: "short" });

// ---------------------------------------------------------------- posts
function home() {
  setNav("posts"); document.title = "NBA Fantasy 2026";
  if (!posts.length) { app.innerHTML = '<p class="empty">No posts yet.</p>'; return; }
  app.innerHTML = posts.map(p => `<a class="card" href="#/${encodeURIComponent(p.slug)}">${meta(p)}<h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p></a>`).join("");
}
async function show(slug) {
  setNav("posts");
  const p = posts.find(x => x.slug === slug);
  if (!p) { home(); return; }
  app.innerHTML = '<p class="empty">Loading…</p>';
  try {
    let md = await (await fetch(`posts/${encodeURIComponent(slug)}.md`, { cache: "no-cache" })).text();
    md = md.replace(/^---[\s\S]*?\n---\s*/, "");
    document.title = p.title + " · NBA Fantasy 2026";
    app.innerHTML = `<a class="back" href="#">← All posts</a><article>${meta(p)}<h1>${esc(p.title)}</h1>${DOMPurify.sanitize(marked.parse(md))}</article>`;
    window.scrollTo(0, 0);
  } catch (e) { app.innerHTML = '<p class="empty">Couldn\'t load that post.</p>'; }
}

// ---------------------------------------------------------------- live odds: projected margin chart
const ET_FMT = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
function etDay(ts) {  // days since 1970 in US Eastern (fractional)
  const p = Object.fromEntries(ET_FMT.formatToParts(new Date(ts)).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, +p.month - 1, +p.day) / 864e5 + ((+p.hour % 24) + +p.minute / 60) / 24;
}
function niceStep(big) { return [10, 20, 25, 50, 100, 150, 200, 250, 500].find(s => s * 2 >= big) || 1000; }
// pts: [[iso, margin, p10, p90, home_win_pct, pts_home, pts_away], ...]; final: {m, s:[h,a]}
function marginChart(pts, home, away, final) {
  if (!pts || !pts.length) return "";
  const d0 = etDay(pts[0][0]), mon = Math.floor(d0) - ((new Date(Math.floor(d0) * 864e5).getUTCDay() + 6) % 7);
  let P = pts.map(p => ({ x: etDay(p[0]) - mon, m: p[1], lo: p[2], hi: p[3], w: p[4], s: [p[5], p[6]], t: p[0] }));
  if (final) P.push({ x: 7, m: final.m, lo: final.m, hi: final.m, w: final.m > 0 ? 100 : final.m < 0 ? 0 : 50, s: final.s, t: "final" });
  const big = Math.max(20, ...P.map(p => Math.max(Math.abs(p.lo), Math.abs(p.hi), Math.abs(p.m))));
  const step = niceStep(big), lim = step * 2 * 1.06;
  const W = 600, H = 150, X = d => d / 7 * W, Y = v => (1 - (v + lim) / (2 * lim)) * H;
  const line = P.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.m).toFixed(1)).join(" ");
  const band = P.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.hi).toFixed(1)).join(" ") + " " +
    P.slice().reverse().map(p => "L" + X(p.x).toFixed(1) + " " + Y(p.lo).toFixed(1)).join(" ") + " Z";
  const area = `${line} L${X(P[P.length - 1].x).toFixed(1)} ${Y(0)} L${X(P[0].x).toFixed(1)} ${Y(0)} Z`;
  const id = "c" + Math.random().toString(36).slice(2, 8);
  const days = ["M", "T", "W", "T", "F", "S", "S"].map((l, i) => `<line x1="${X(i)}" x2="${X(i)}" y1="0" y2="${H}" class="wp-grid"/><text x="${X(i + 0.5)}" y="${H + 14}" class="wp-day">${l}</text>`).join("");
  const ticks = [-2, -1, 1, 2].map(k => `<span class="mg-y" style="top:${(Y(k * step) + 2) / (H + 22) * 100}%">${k > 0 ? "+" : "−"}${Math.abs(k * step)}</span>`).join("");
  const last = P[P.length - 1];
  const data = esc(JSON.stringify(P.map(p => [X(p.x), p.m, p.lo, p.hi, p.w, p.s, p.t])));
  return `<div class="wp" data-p="${data}" data-h="${esc(home)}" data-a="${esc(away)}">
    <div class="wp-lbl top">${esc(home)} ahead ↑</div>
    <div class="wp-plot">${ticks}<svg viewBox="0 -2 ${W} ${H + 22}" preserveAspectRatio="none">
      <defs><clipPath id="${id}a"><rect x="0" y="-2" width="${W}" height="${Y(0) + 2}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${Y(0)}" width="${W}" height="${H}"/></clipPath></defs>
      ${days}<path d="${band}" class="mg-band"/>
      <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" class="wp-mid"/>
      <path d="${area}" class="mg-pos" clip-path="url(#${id}a)"/><path d="${area}" class="mg-neg" clip-path="url(#${id}b)"/>
      <path d="${line}" class="wp-line" vector-effect="non-scaling-stroke"/>
      <line class="wp-cur" x1="0" x2="0" y1="0" y2="${H}" style="display:none" vector-effect="non-scaling-stroke"/>
    </svg>
    <span class="wp-dot${last.m < 0 ? " a" : ""}" style="left:${X(last.x) / W * 100}%;top:${(Y(last.m) + 2) / (H + 22) * 100}%"></span></div>
    <div class="wp-lbl bot">${esc(away)} ahead ↓</div>
    <div class="wp-tip"></div></div>`;
}
function wireMarginCharts() {
  app.querySelectorAll(".wp[data-h]").forEach(el => {
    const P = JSON.parse(el.dataset.p), svg = el.querySelector("svg"), cur = el.querySelector(".wp-cur"), tip = el.querySelector(".wp-tip");
    const show = e => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 600;
      const p = P.reduce((a, b) => Math.abs(b[0] - x) < Math.abs(a[0] - x) ? b : a);
      cur.setAttribute("x1", p[0]); cur.setAttribute("x2", p[0]); cur.style.display = "";
      const lead = p[1] >= 0 ? el.dataset.h : el.dataset.a;
      const when = p[6] === "final" ? "Final" : new Date(p[6]).toLocaleString("en-AU", { weekday: "short", hour: "numeric", minute: "2-digit" });
      const body = p[6] === "final" ? `<b>${esc(lead)} won by ${f1(Math.abs(p[1]))}</b>`
        : `<b>${esc(short(lead))} by ${Math.round(Math.abs(p[1]))}</b> proj · ${p[4] >= 50 ? p[4] : 100 - p[4]}%<br><small>range ${sgn(p[2])} to ${sgn(p[3])} · score ${f0(p[5][0])}–${f0(p[5][1])}</small>`;
      tip.innerHTML = `${body}<br><small>${when}</small>`;
      tip.style.left = Math.min(Math.max(p[0] / 6, 20), 80) + "%"; tip.style.opacity = 1;
    };
    el.addEventListener("pointermove", show); el.addEventListener("pointerdown", show);
    el.addEventListener("pointerleave", () => { cur.style.display = "none"; tip.style.opacity = 0; });
  });
}

let OH = null, ODDS_WEEK = null, ACC = null;
async function oddsPage() {
  setNav("odds"); document.title = "Live odds · NBA Fantasy 2026";
  app.innerHTML = '<p class="empty">Loading…</p>';
  let o;
  try { o = await getJSON("data/odds.json"); } catch (e) { app.innerHTML = '<p class="empty">Live odds aren\'t available yet.</p>'; return; }
  try { if (!OH) OH = await getJSON("data/odds_history.json"); } catch (e) { OH = {}; }
  try { if (!ACC) ACC = await getJSON("data/accuracy.json"); } catch (e) { ACC = null; }
  const curWk = String(o.matchup_period), wk = ODDS_WEEK && OH[ODDS_WEEK] ? ODDS_WEEK : curWk;
  const weeks = [...new Set([curWk, ...Object.keys(OH)])].sort((a, b) => b - a);
  const tabs = weeks.length > 1 ? `<div class="seg">${weeks.map(w => `<button type="button" data-w="${w}" class="${w === wk ? "on" : ""}">${w === curWk ? "This week" : "Week " + w}</button>`).join("")}</div>` : "";
  const H = OH[wk] || {};
  if (wk !== curWk) {
    const res = ((ACC && ACC.weeks) || []).find(w => String(w.week) === wk);
    const cards = Object.entries(H).map(([k, pts]) => {
      const [home, away] = k.split("|"), r = res && res.matchups.find(m => m.home === home && m.away === away && m.actual);
      const fin = r ? { m: r.actual[0] - r.actual[1], s: r.actual } : null;
      const won = r ? (r.actual[0] > r.actual[1] ? "h" : r.actual[1] > r.actual[0] ? "a" : "") : "";
      return `<div class="card"><div class="mu-head"><div class="mu-team ${won === "a" ? "lose" : ""}">${esc(home)}</div>
        <div class="pts">${r ? `${f1(r.actual[0])}–${f1(r.actual[1])}` : "–"}<small>final</small></div><div class="mu-team r ${won === "h" ? "lose" : ""}">${esc(away)}</div></div>
        ${marginChart(pts, home, away, fin)}</div>`;
    }).join("");
    app.innerHTML = `${tabs}<p class="updated">Week ${wk}, final. The line is the projected final margin through the week; the grey band is the model's 80% range.</p>${cards || '<p class="empty">No history for this week.</p>'}`;
  } else {
    const cards = o.matchups.map(m => {
      const lead = m.proj_margin >= 0 ? m.home : m.away;
      return `<div class="card"><div class="mu-head"><div class="mu-team">${esc(m.home)}</div>
        <div class="pts">${f1(m.points_now[0])}–${f1(m.points_now[1])}<small>so far</small></div>
        <div class="mu-team r">${esc(m.away)}</div></div>
        <div class="bar"><i style="width:${m.home_win_pct}%"></i><b style="width:${m.away_win_pct}%"></b></div>
        <div class="mu-odds"><span><strong>${m.home_win_pct}%</strong> · $${m.price_home.toFixed(2)}</span><span>$${m.price_away.toFixed(2)} · <strong>${m.away_win_pct}%</strong></span></div>
        <div class="mu-sub"><span>Proj <b>${f0(m.proj_final[0])}</b> · ${m.games_left[0]} games left</span><span>${m.games_left[1]} games left · <b>${f0(m.proj_final[1])}</b> proj</span></div>
        <p class="note" style="margin:8px 0 0">${esc(lead)} by <b>${Math.round(Math.abs(m.proj_margin))}</b> projected · 80% range ${esc(short(m.home))} ${sgn(m.margin_80[0])} to ${sgn(m.margin_80[1])}</p>
        ${marginChart(H[m.home + "|" + m.away], m.home, m.away)}</div>`;
    }).join("");
    app.innerHTML = `${tabs}<p class="updated">Week ${o.matchup_period} · updated ${esc(ago(o.updated_utc))} · refreshes every 30 minutes. Win % comes from simulating the rest of the week 1,000 times (real NBA schedule, best lineup each day, injuries). The chart tracks the <b>projected final margin</b>: above the line the home team is ahead, below it the away team; the grey band is the 80% range. Tap it for any moment.</p>${cards}`;
  }
  app.querySelectorAll(".seg button").forEach(b => b.onclick = () => { ODDS_WEEK = b.dataset.w; oddsPage(); });
  wireMarginCharts();
}

// ---------------------------------------------------------------- ladder
let LAD = null, LAD_SORT = "ladder";
async function ladderPage() {
  setNav("ladder"); document.title = "Ladder · NBA Fantasy 2026";
  if (!LAD) {
    app.innerHTML = '<p class="empty">Loading…</p>';
    try { LAD = await getJSON("data/league.json"); } catch (e) { app.innerHTML = '<p class="empty">The ladder isn\'t available yet.</p>'; return; }
  }
  const L = LAD, sort = LAD_SORT;
  const mv = x => !x ? "" : `<span class="${x > 0 ? "up" : "down"}">${x > 0 ? "▲" : "▼"}${Math.abs(x)}</span>`;
  const pc = x => x >= 1 || x === 0 ? Math.round(x) + "%" : x.toFixed(1) + "%";
  const k1 = x => (x / 1000).toFixed(1) + "k";
  // change in a chance since yesterday, in percentage points
  const chg = x => !x || Math.abs(x) < 0.05 ? "" : `<small class="${x > 0 ? "up" : "down"}">${x > 0 ? "▲" : "▼"}${Math.abs(x) >= 10 ? Math.round(Math.abs(x)) : Math.abs(x).toFixed(1)}</small>`;
  const seg = `<div class="seg">${[["ladder", "Ladder"], ["power", "Power rankings"]].map(([k, l]) => `<button type="button" data-s="${k}" class="${k === sort ? "on" : ""}">${l}</button>`).join("")}</div>`;
  let head, rows, how;
  if (sort === "ladder") {
    const list = L.ladder.slice().sort((a, b) => (a.seed ?? 99) - (b.seed ?? 99));
    head = `<tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>D</th><th>PF</th><th>PA</th></tr>`;

      const inj = p.status && p.status !== "ACTIVE" ? ` · ${esc(p.status.replace(/_/g, " ").toLowerCase())}${back}` : "";
      return `<label><input type="checkbox" value="${esc(p.name)}"> <span>${esc(p.name)}<br><small>${line}${inj}</small></span></label>`;
    }).join("");
  };
  const movesNote = (n, m) => (m.drops.length ? `<p class="note">${esc(n)} would have to drop ${m.drops.map(esc).join(" and ")} (their least valuable player) to fit everyone in.</p>` : "")

    const winner = Math.abs(r.a.change - r.b.change) < 0.05 ? "Pretty even trade." : (r.a.change > r.b.change ? esc(na) : esc(nb)) + " win this one.";
    out.innerHTML = `<div class="card"><div class="res">
      <div><div class="note">${esc(na)}</div><div class="big ${cls(r.a.change, 0.005)}">${sgn(r.a.change, 2)}</div><div class="note">expected wins</div><div class="note"><b class="${cls(r.a.weekly, 0.5)}">${sgn(r.a.weekly)}</b> FPTS a week</div></div>
      <div><div class="note">${esc(nb)}</div><div class="big ${cls(r.b.change, 0.005)}">${sgn(r.b.change, 2)}</div><div class="note">expected wins</div><div class="note"><b class="${cls(r.b.weekly, 0.5)}">${sgn(r.b.weekly)}</b> FPTS a week</div></div></div>
      <p><strong>${winner}</strong></p>${movesNote(na, r.a.moves)}${movesNote(nb, r.b.moves)}
      <p class="note">Expected wins = change in matchups won over the rest of the regular season. FPTS a week = change in a typical week's fantasy points (best lineup, ~3.4 games a player, injuries counted until each player's return date). Rosters as of ${esc(ago(MODEL.updated_utc))}.</p></div>`;
  };
  ta.onchange = () => { list(ta, document.getElementById("pa")); run(); };

  app.querySelector(".calc").addEventListener("change", e => { if (e.target.type === "checkbox") run(); });
  list(ta, document.getElementById("pa")); list(tb, document.getElementById("pb")); run();
}

let TR = null;
function tradeChart(series, A, B) {
  // series: [[date, A's points lead], ...] since the trade
  if (!series || !series.length) return "";
  const pts = [[null, 0], ...series], n = pts.length - 1;
  const step = niceStep(Math.max(10, ...pts.map(p => Math.abs(p[1])))), lim = step * 2 * 1.08;
  const W = 600, H = 132, X = i => i / n * W, Y = v => (1 - (v + lim) / (2 * lim)) * H, pct = y => (y + 2) / (H + 4) * 100;
  const path = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const area = `${path} L${W} ${Y(0)} L0 ${Y(0)} Z`, id = "t" + Math.random().toString(36).slice(2, 8);
  const ticks = [-2, -1, 0, 1, 2].map(k => `<span class="tc-y" style="top:${pct(Y(k * step))}%">${k ? sgn(k * step) : "0"}</span>`).join("");
  const grid = [-2, -1, 1, 2].map(k => `<line x1="0" x2="${W}" y1="${Y(k * step)}" y2="${Y(k * step)}" class="wp-grid" vector-effect="non-scaling-stroke"/>`).join("");
  const end = pts[n][1], data = esc(JSON.stringify(pts.map((p, i) => [X(i) / W * 100, p[0], p[1]])));
  return `<div class="wp tc" data-p="${data}" data-a="${esc(A)}" data-b="${esc(B)}">
    <div class="tc-wrap"><div class="tc-axis">${ticks}</div><div class="wp-plot" style="height:136px">
      <svg viewBox="0 -2 ${W} ${H + 4}" preserveAspectRatio="none" style="height:136px">${grid}
        <defs><clipPath id="${id}a"><rect x="0" y="-2" width="${W}" height="${Y(0) + 2}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${Y(0)}" width="${W}" height="${H}"/></clipPath></defs>
        <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" class="wp-mid"/>
        <path d="${area}" class="mg-pos" clip-path="url(#${id}a)"/><path d="${area}" class="mg-neg" clip-path="url(#${id}b)"/>
        <path d="${path}" class="wp-line" vector-effect="non-scaling-stroke"/>
        <line class="wp-cur" x1="0" x2="0" y1="0" y2="${H}" style="display:none" vector-effect="non-scaling-stroke"/></svg>
      <span class="wp-dot${end < 0 ? " a" : ""}" style="left:100%;top:${pct(Y(end))}%"></span>
      <span class="tc-end ${end >= 0 ? "ka" : "kb"}" style="top:${pct(Y(end))}%">${sgn(end)}</span>
      <div class="wp-tip"></div></div></div>
    <div class="tc-dates"><span>Trade</span><span>${day(series[n - 1][0])}</span></div>
    <div class="tc-key"><span class="ka">${esc(A)} ahead ↑</span><span class="kb">${esc(B)} ahead ↓</span><span class="kn">points margin · tap for any day</span></div></div>`;
}
function wireTradeCharts() {
  app.querySelectorAll(".tc").forEach(el => {
    const P = JSON.parse(el.dataset.p), plot = el.querySelector(".wp-plot"), cur = el.querySelector(".wp-cur"), tip = el.querySelector(".wp-tip");
    const show = e => {
      const r = plot.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 100;
      const p = P.reduce((a, b) => Math.abs(b[0] - x) < Math.abs(a[0] - x) ? b : a);
      cur.setAttribute("x1", p[0] * 6); cur.setAttribute("x2", p[0] * 6); cur.style.display = "";
      const when = p[1] ? new Date(p[1] + "T12:00:00").toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" }) : "Trade day";
      const lead = p[2] > 0 ? el.dataset.a : p[2] < 0 ? el.dataset.b : null;
      tip.innerHTML = `<b>${when}</b><br>${lead ? `${esc(short(lead))} +${f1(Math.abs(p[2]))}` : "Level"}`;
      tip.style.left = Math.min(Math.max(p[0], 22), 78) + "%"; tip.style.opacity = 1;
    };
    plot.addEventListener("pointermove", show); plot.addEventListener("pointerdown", show);
    plot.addEventListener("pointerleave", () => { cur.style.display = "none"; tip.style.opacity = 0; });
  });
}

    const ms = w.matchups.map(m => {
      const fh = m.home_win_pct >= 50, fav = fh ? m.home : m.away, fp = Math.max(m.home_win_pct, 100 - m.home_win_pct);
      const res = m.actual ? `Final ${f1(m.actual[0])}–${f1(m.actual[1])} · projected ${f0(m.proj[0])}–${f0(m.proj[1])} · margin ${m.in_range ? "inside" : "outside"} the 80% range` : `Projected ${f0(m.proj[0])}–${f0(m.proj[1])}`;
      return `<div class="rc-m"><i class="${!m.actual ? "lvl" : m.called ? "ok" : "no"}"></i><div><b>${esc(fav)}</b> <small>${fp}% to beat ${esc(fh ? m.away : m.home)}</small><small>${res}</small></div></div>`;
    }).join("");
    const label = !w.finished ? "In progress" : `${done.filter(m => m.called).length} of ${done.length} right`;
    const note = w.opening ? "" : `<p class="rc-note">First forecast was saved mid-week, after games had started, so this week isn't scored.</p>`;
    return `<details class="rc-wk${w.finished ? "" : " live"}"><summary><span class="rc-wn">W${w.week}</span><span class="rc-mid"><span class="rc-lbl">${label}</span>${dots}</span><span class="rc-val">${w.finished ? "" : "live"}</span></summary>${note}${ms}</details>`;
  };
  const weeks = ACC.weeks.length ? `<section><h2 class="rc-h">Week by week <small>tap a week to see every pick</small></h2><div class="rc-list">${ACC.weeks.slice().reverse().map(weekRow).join("")}</div></section>` : "";
  const how = `<details class="rc-how"><summary>How this works</summary><div class="explain">
    <h3>The model, in five steps</h3>
    <ol><li><strong>How good is each player?</strong> Fantasy points per game, using the league's own scoring. Early in the season it's mixed with ESPN's projection so one hot week doesn't fool it.</li>
      <li><strong>How many games?</strong> The real NBA schedule. Healthy players play about 93% of games; injured players count as out until their projected return date, then healthy.</li>
      <li><strong>Who starts?</strong> Every manager is assumed to set their best lineup each day, within the 10 starting slots, so a crowded night wastes games.</li>
      <li><strong>Play the week 1,000 times</strong> with real-game randomness. Win 700 of the runs and that's a 70% chance; the middle 80% of the margins is the 80% range.</li>
      <li><strong>Odds</strong> are that % turned into bookie prices, just for fun.</li></ol>
    <h3>What it's graded on</h3>
    <p><strong>Brier score:</strong> for each matchup, how far short of 100% the model's chance for the eventual winner was, squared. Lower is better and saying 50/50 every time scores 0.25, so that's the line to beat. A confident miss costs far more than a cautious one.</p>
    <p><strong>Average miss:</strong> how far a team's final weekly points were from the Monday projection. <strong>Bias:</strong> whether it keeps projecting too high or too low.</p>
    <p><strong>80% range:</strong> about 8 in 10 final margins should land inside it. Much fewer means the model is overconfident; many more means it's too cautious.</p></div></details>`;
  app.innerHTML = `<div class="rc">${hero}${cal}${weeks}${how}</div>`;
}

// ---------------------------------------------------------------- router
function route() {
  const slug = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const pages = { odds: oddsPage, ladder: ladderPage, trade: tradePage, injuries: injuriesPage, record: recordPage, trades: tradesPage };
  if (pages[slug]) return pages[slug]();
  slug ? show(slug) : home();
}
fetch("posts/index.json", { cache: "no-cache" })
  .then(r => r.json()).then(j => { posts = j; route(); })
  .catch(() => { posts = []; route(); });
window.addEventListener("hashchange", route);
</script>
</body>
</html>
